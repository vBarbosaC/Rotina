<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guardiã">
<meta name="theme-color" content="#7c5cbf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>A Guardiã da Rotina</title>
<style>
:root{--bg:#faf8ff;--card:#fff;--tx:#2a2540;--mu:#6e6985;--ac:#7c5cbf;--bd:#e4def2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#221e2e;--tx:#ece9f6;--mu:#9d97b5;--ac:#a58cf0;--bd:#352f47}}
:root[data-theme="dark"]{--bg:#17141f;--card:#221e2e;--tx:#ece9f6;--mu:#9d97b5;--ac:#a58cf0;--bd:#352f47}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;max-width:560px;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.mu{color:var(--mu);font-size:14px}
.big{font-size:22px;font-weight:600;margin:6px 0 14px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.g.on{background:var(--ac);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}
label.it,div.it{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--bd)}
.it input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.it.cur{background:color-mix(in srgb,var(--ac) 14%,transparent);border-radius:8px}
.it.d span{text-decoration:line-through;color:var(--mu)}
.tm{color:var(--mu);font-size:13px;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 4px;font-size:14px}
nav button.on{color:var(--ac);font-weight:600}
select,input.tx{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin:6px 0}
select{width:auto}
ul{padding-left:20px;margin:6px 0}
</style></head><body>
<h1>🐾 A Guardiã da Rotina</h1>
<div id="app"></div>
<nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://bxcphgstvmzrktxvvpin.supabase.co','sb_publishable_ciIQaI4Iu_ZEZT74RNJEmg_sNpgWO83');
const DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MD=['Normal','Reduzido','Mínimo'];
const ME=[[],['Alimentar e cuidar dos animais','Refeições e higiene','Uma prioridade profissional','5–10 min de organização','Preparar o amanhã'],['Comida e água dos animais e necessidades do Rock','Comer, beber água e higiene','Comunicar ou reorganizar o urgente','Descansar']];
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let S={u:null,W:{},X:{},done:new Set(),mode:0,owner:null,ro:false,w:0,msg:''},tab='agora',vd=new Date().getDay(),day=key(new Date());
async function init(){
const r=await sb.auth.getSession();
if(!r.data.session){S.u=null;R();return}
S.u=r.data.session.user.id;
try{
const q=await Promise.all([sb.from('blocks').select('*').order('start_min'),sb.from('checklist_items').select('*').order('sort'),sb.from('viewers').select('owner_id').eq('viewer_id',S.u),sb.from('viewers').select('viewer_id').eq('owner_id',S.u)]);
if(q[0].error)throw q[0].error;
S.W={};S.X={};
q[0].data.forEach(x=>(S.W[x.dow]=S.W[x.dow]||[]).push({id:x.id,s:x.start_min,e:x.end_min,a:hm(x.start_min),b:hm(x.end_min),t:x.title}));
q[1].data.forEach(x=>(S.X[x.dow]=S.X[x.dow]||[]).push({id:x.id,t:x.title}));
S.owner=(q[2].data&&q[2].data[0]&&q[2].data[0].owner_id)||S.u;S.ro=S.owner!==S.u;S.w=(q[3].data||[]).length;
await lp();S.msg='';
}catch(e){S.msg='Não foi possível carregar. Verifique a internet.'}
R()}
async function lp(){
day=key(new Date());
const q=await Promise.all([sb.from('progress').select('item').eq('day',day).eq('user_id',S.owner),sb.from('day_mode').select('mode').eq('day',day).eq('user_id',S.owner)]);
S.done=new Set((q[0].data||[]).map(x=>x.item));S.mode=(q[1].data&&q[1].data[0]&&q[1].data[0].mode)||0}
async function login(ev){
ev.preventDefault();const f=ev.target;S.msg='Entrando…';R();
const r=await sb.auth.signInWithPassword({email:f.em.value.trim(),password:f.pw.value});
if(r.error){S.msg='E-mail ou senha incorretos.';R();return}
S.msg='';init()}
async function out(){await sb.auth.signOut();S.u=null;R()}
async function tg(it){
if(S.ro)return;
if(S.done.has(it)){S.done.delete(it);R();await sb.from('progress').delete().eq('user_id',S.u).eq('day',day).eq('item',it)}
else{S.done.add(it);R();await sb.from('progress').insert({user_id:S.u,day:day,item:it})}}
async function sm(n){if(S.ro)return;S.mode=n;R();await sb.from('day_mode').upsert({user_id:S.u,day:day,mode:n},{onConflict:'user_id,day'})}
const st=t=>{tab=t;R()};
const sd=v=>{vd=+v;R()};
function R(){
const app=document.getElementById('app'),nav=document.getElementById('nav');
if(!S.u){
nav.innerHTML='';
app.innerHTML='<div class="card"><div class="big">Entrar</div><form onsubmit="login(event)"><input class="tx" name="em" type="email" placeholder="E-mail" autocomplete="username" required><input class="tx" name="pw" type="password" placeholder="Senha" autocomplete="current-password" required><button style="width:100%;margin-top:8px">Entrar</button></form><div class="mu" style="margin-top:10px">'+S.msg+'</div></div>';
return}
const now=new Date(),td=now.getDay(),nm=now.getHours()*60+now.getMinutes(),mo=S.mode,bl=S.W[td]||[],xl=S.X[td]||[];
const cur=bl.findIndex(b=>nm>=b.s&&nm<b.e),nx=bl.findIndex(b=>b.s>nm);
const dn=bl.filter(b=>S.done.has('b'+b.id)).length;
let h='';
if(S.msg)h+='<div class="card">'+S.msg+'</div>';
if(S.ro)h+='<div class="mu">Você está acompanhando a rotina (somente leitura).</div>';
else if(S.w)h+='<div class="mu">Esta rotina é acompanhada por '+S.w+(S.w>1?' pessoas':' pessoa')+'.</div>';
if(tab=='agora'){
if(mo)h+='<div class="card"><b>Modo '+MD[mo].toLowerCase()+'</b><ul>'+ME[mo].map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="mu">Hoje basta isto. Um dia difícil não apaga os anteriores.</div></div>';
if(cur>=0){const b=bl[cur],d=S.done.has('b'+b.id);h+='<div class="card"><div class="mu">AGORA · '+b.a+'–'+b.b+'</div><div class="big">'+b.t+'</div>'+(S.ro?'':'<button onclick="tg(\'b'+b.id+'\')">'+(d?'Desfazer':'Feito ✓')+'</button>')+(S.ro&&d?'<div>✓ Feito</div>':'')+'</div>'}
else h+='<div class="card"><div class="big">'+(nx>=0?'Intervalo. Respire.':'Dia encerrado. Bom descanso.')+'</div></div>';
if(nx>=0)h+='<div class="card"><div class="mu">EM SEGUIDA · '+bl[nx].a+'</div><div>'+bl[nx].t+'</div></div>';
h+='<div class="mu">'+DN[td]+' · '+dn+' de '+bl.length+' blocos feitos</div>';
}else if(tab=='dia'){
const v=vd==td;
h+='<div class="row"><select onchange="sd(this.value)">'+DN.map((n,i)=>'<option value="'+i+'"'+(i==vd?' selected':'')+'>'+n+(i==td?' (hoje)':'')+'</option>').join('')+'</select></div><div class="card">';
(S.W[vd]||[]).forEach((b,i)=>{const c=v&&i==cur?' cur':'',d=v&&S.done.has('b'+b.id)?' d':'',t='<span><span class="tm">'+b.a+'–'+b.b+'</span>'+b.t+'</span>';
h+=v?'<label class="it'+c+d+'"><input type="checkbox" '+(d?'checked ':'')+(S.ro?'disabled ':'')+'onchange="tg(\'b'+b.id+'\')">'+t+'</label>':'<div class="it">'+t+'</div>'});
h+='</div>';
}else if(tab=='check'){
h+='<div class="mu">Checklist de '+DN[td]+'</div><div class="card">';
xl.forEach(x=>{const d=S.done.has('c'+x.id);h+='<label class="it'+(d?' d':'')+'"><input type="checkbox" '+(d?'checked ':'')+(S.ro?'disabled ':'')+'onchange="tg(\'c'+x.id+'\')"><span>'+x.t+'</span></label>'});
h+='</div>';
}else{
if(!S.ro)h+='<div class="card"><b>Como está o dia?</b><div class="row" style="margin-top:10px">'+MD.map((n,i)=>'<button class="g'+(i==mo?' on':'')+'" onclick="sm('+i+')">'+n+'</button>').join('')+'</div></div>';
h+='<div class="card"><b>Atrasou? Protocolo anti-atraso</b><ul><li>Olhe o relógio: qual bloco é AGORA?</li><li>Escolha a próxima ação de 5 minutos</li><li>Não dobre tarefas para compensar atrasos</li><li>Registre a vitória possível e siga</li></ul></div>';
h+='<div class="card"><b>Regras inegociáveis</b><ul><li>Gatos e Rock: comida ao acordar e antes de dormir</li><li>Sachê dos gatos às 19h30</li><li>Passeios do Rock de manhã e à noite</li><li>Lixo na rua até 17h30 (seg, qua, sex)</li><li>Terapia online: quarta, 20h</li><li>Reunião das atendentes: quinta, 9h</li></ul></div>';
h+='<button class="g" onclick="out()">Sair da conta</button>';
}
app.innerHTML=h;
nav.innerHTML=[['agora','Agora'],['dia','Dia'],['check','Checklist'],['modos','Modos']].map(t=>'<button class="'+(tab==t[0]?'on':'')+'" onclick="st(\''+t[0]+'\')">'+t[1]+'</button>').join('');
}
setInterval(async()=>{if(S.u&&(S.ro||key(new Date())!==day)){try{await lp()}catch(e){}}R()},60000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
init();
</script></body></html>
